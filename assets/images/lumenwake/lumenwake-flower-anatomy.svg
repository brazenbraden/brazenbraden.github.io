<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">How a Lumenwake flower is built</title><desc id="d">Four stages show a rectangle becoming a petal, then a radial arrangement, and finally a glowing flower.</desc><defs><filter id="g" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="gl"><stop stop-color="#69ffb5" stop-opacity=".4"/><stop offset="1" stop-color="#69ffb5" stop-opacity="0"/></radialGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#526d92"/></marker></defs><rect width="1200" height="520" rx="18" fill="#070b1a"/><text x="600" y="58" text-anchor="middle" fill="#efffff" font-family="sans-serif" font-size="28" letter-spacing="4">THE EVOLUTION OF A RECTANGLE</text><text x="600" y="91" text-anchor="middle" fill="#8299bb" font-family="sans-serif" font-size="16">primitive geometry + rotation + layering + glow</text><g stroke="#526d92" stroke-width="3" opacity=".75" marker-end="url(#arrow)"><line x1="255" y1="285" x2="345" y2="285"/><line x1="545" y1="285" x2="635" y2="285"/><line x1="835" y1="285" x2="925" y2="285"/></g><g transform="translate(170 285)"><rect x="-42" y="-22" width="84" height="44" rx="3" fill="#69ffb5"/><text y="145" text-anchor="middle" fill="#efffff" font-family="sans-serif" font-size="20">1. Rectangle</text><text y="173" text-anchor="middle" fill="#7188aa" font-family="sans-serif" font-size="15">DragonRuby :solid</text></g><g transform="translate(460 285)"><rect x="-18" y="-80" width="36" height="100" rx="18" fill="#69ffb5" transform="rotate(28)"/><text y="145" text-anchor="middle" fill="#efffff" font-family="sans-serif" font-size="20">2. Petal</text><text y="173" text-anchor="middle" fill="#7188aa" font-family="sans-serif" font-size="15">reshape and rotate</text></g><g transform="translate(750 285)"><g fill="#69ffb5"><rect x="-12" y="-74" width="24" height="58" rx="12"/><rect x="-12" y="-74" width="24" height="58" rx="12" transform="rotate(60)"/><rect x="-12" y="-74" width="24" height="58" rx="12" transform="rotate(120)"/><rect x="-12" y="-74" width="24" height="58" rx="12" transform="rotate(180)"/><rect x="-12" y="-74" width="24" height="58" rx="12" transform="rotate(240)"/><rect x="-12" y="-74" width="24" height="58" rx="12" transform="rotate(300)"/></g><circle r="20" fill="#d9ffe8"/><text y="145" text-anchor="middle" fill="#efffff" font-family="sans-serif" font-size="20">3. Structure</text><text y="173" text-anchor="middle" fill="#7188aa" font-family="sans-serif" font-size="15">repeat around a center</text></g><g transform="translate(1040 285)"><circle r="118" fill="url(#gl)"/><g fill="#69ffb5" filter="url(#g)"><rect x="-12" y="-74" width="24" height="58" rx="12"/><rect x="-12" y="-74" width="24" height="58" rx="12" transform="rotate(60)"/><rect x="-12" y="-74" width="24" height="58" rx="12" transform="rotate(120)"/><rect x="-12" y="-74" width="24" height="58" rx="12" transform="rotate(180)"/><rect x="-12" y="-74" width="24" height="58" rx="12" transform="rotate(240)"/><rect x="-12" y="-74" width="24" height="58" rx="12" transform="rotate(300)"/></g><circle r="22" fill="#dcffea"/><circle r="8" fill="white"/><text y="145" text-anchor="middle" fill="#efffff" font-family="sans-serif" font-size="20">4. Bloom</text><text y="173" text-anchor="middle" fill="#7188aa" font-family="sans-serif" font-size="15">layer, pulse, and glow</text></g></svg>