<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">The Lumenwake game loop</title><desc id="d">A loop connects collecting sparks, choosing a bloom, crossing danger, and awakening the ecosystem, with branches to victory and game over.</desc><defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#54779d"/></marker></defs><rect width="1200" height="760" rx="18" fill="#060a18"/><text x="600" y="58" text-anchor="middle" fill="#efffff" font-family="sans-serif" font-size="30" letter-spacing="5">THE LUMENWAKE LOOP</text><text x="600" y="91" text-anchor="middle" fill="#8199bc" font-family="sans-serif" font-size="16">one movement verb, several increasingly risky decisions</text><g fill="none" stroke="#54779d" stroke-width="4" marker-end="url(#a)"><path d="M600 212 L600 270"/><path d="M600 374 L600 432"/><path d="M600 536 L600 594"/><path d="M450 646 C190 646 155 164 445 160"/><path d="M760 484 C930 484 950 320 950 261"/><path d="M760 646 C940 646 1010 646 1010 590"/></g><g font-family="sans-serif"><g transform="translate(600 160)"><rect x="-155" y="-52" width="310" height="104" rx="18" fill="#0b2033" stroke="#4fe8ff" stroke-width="2"/><rect x="-17" y="-17" width="34" height="34" transform="rotate(45)" fill="#4fe8ff" filter="url(#g)"/><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="white"/><text y="81" text-anchor="middle" fill="#efffff" font-size="21">COLLECT SPARKS</text></g><g transform="translate(600 322)"><rect x="-155" y="-52" width="310" height="104" rx="18" fill="#15142d" stroke="#be89ff" stroke-width="2"/><g fill="#be89ff"><circle cx="-45" r="8"/><circle r="8"/><circle cx="45" r="8"/></g><text y="81" text-anchor="middle" fill="#efffff" font-size="21">CHOOSE A BLOOM</text></g><g transform="translate(600 484)"><rect x="-155" y="-52" width="310" height="104" rx="18" fill="#29101e" stroke="#ff5c80" stroke-width="2"/><g transform="translate(0 -2)" fill="#ff5c80" filter="url(#g)"><rect x="-7" y="-30" width="14" height="60" rx="5" transform="rotate(20)"/><rect x="-7" y="-30" width="14" height="60" rx="5" transform="rotate(110)"/></g><circle cy="-2" r="12" fill="#21091c"/><text y="81" text-anchor="middle" fill="#efffff" font-size="21">CROSS DANGEROUS SPACE</text></g><g transform="translate(600 646)"><rect x="-155" y="-52" width="310" height="104" rx="18" fill="#10291f" stroke="#69ffb5" stroke-width="2"/><g fill="#69ffb5" filter="url(#g)"><rect x="-6" y="-32" width="12" height="25" rx="6"/><rect x="-6" y="-32" width="12" height="25" rx="6" transform="rotate(60)"/><rect x="-6" y="-32" width="12" height="25" rx="6" transform="rotate(120)"/><rect x="-6" y="-32" width="12" height="25" rx="6" transform="rotate(180)"/><rect x="-6" y="-32" width="12" height="25" rx="6" transform="rotate(240)"/><rect x="-6" y="-32" width="12" height="25" rx="6" transform="rotate(300)"/></g><circle r="8" fill="white"/><text y="81" text-anchor="middle" fill="#efffff" font-size="21">AWAKEN THE BLOOM</text></g><g transform="translate(1010 205)"><rect x="-125" y="-52" width="250" height="104" rx="18" fill="#2c2612" stroke="#ffd35c" stroke-width="2"/><text y="-4" text-anchor="middle" fill="#ffd35c" font-size="22" font-weight="bold">ALL 8 AWAKE?</text><text y="26" text-anchor="middle" fill="#efffff" font-size="18">Victory</text></g><g transform="translate(1010 536)"><rect x="-125" y="-52" width="250" height="104" rx="18" fill="#28101b" stroke="#ff5c80" stroke-width="2"/><text y="-4" text-anchor="middle" fill="#ff8ca5" font-size="22" font-weight="bold">LIGHTS OUT?</text><text y="26" text-anchor="middle" fill="#efffff" font-size="18">Game over</text></g><text x="310" y="375" text-anchor="middle" fill="#69ffb5" font-size="17">score rises</text><text x="310" y="398" text-anchor="middle" fill="#ff8ca5" font-size="17">pressure rises too</text><text x="820" y="455" fill="#ff8ca5" font-size="16">3 collisions</text><text x="825" y="625" fill="#ffd35c" font-size="16">repeat until restored</text></g></svg>